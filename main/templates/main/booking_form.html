{% extends 'main/base.html' %}
{% load static %}

{% block title %}Book Room {{ room.room_number }}{% endblock %}
{% block content %}
<style>
    .room-container {
        max-width: 600px;
        margin: 40px auto;
        padding: 30px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.08);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .room-container h2 {
        font-size: 26px;
        color: #333;
        margin-bottom: 25px;
        border-bottom: 2px solid #ff6600;
        padding-bottom: 10px;
    }

    .room-container form {
        display: flex;
        flex-direction: column;
    }

    .room-container form p {
        margin-bottom: 15px;
    }

    .room-container label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        color: #222;
    }

    .room-container input,
    .room-container select,
    .room-container textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        background-color: #f9f9f9;
    }

    .room-container input:focus,
    .room-container select:focus,
    .room-container textarea:focus {
        border-color: #ff6600;
        background-color: #fff;
        outline: none;
    }

    .booking-btn {
        padding: 12px 20px;
        background-color: #ff6600;
        color: white;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 20px;
        transition: background-color 0.3s ease;
    }

    .booking-btn:hover {
        background-color: #e55b00;
    }

    .room-container a {
        display: inline-block;
        margin-top: 20px;
        text-decoration: none;
        color: #555;
    }

    .room-container a:hover {
        text-decoration: underline;
        color: #000;
    }

    @media (max-width: 768px) {
        .room-container {
            padding: 20px;
            margin: 20px;
        }
    }
</style>

<div class="room-container">
    <h2>Book Room {{ room.room_number }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="booking-btn">Proceed to Payment</button>
    </form>
    <a href="{% url 'room_detail' room.id %}">← Back to Room</a>
</div>
{% endblock %}
